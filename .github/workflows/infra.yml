name: Infra (AWS)

# Terraform for the product host (infra/aws), run by hand: `plan` shows what
# would change, `apply` changes it. The job runs in the production
# environment, the only thing the role healdesk-github-terraform trusts
# (infra/aws/bootstrap/bootstrap.yaml), and assumes that role with GitHub's
# OIDC token. No AWS key is stored anywhere.
#
# `apply` makes a fresh plan in the same job and applies exactly that saved
# plan, so what changes is what the log shows, and Terraform refuses it if the
# state moved in between. Read a `plan` run first: the apply's plan should
# match it.
#
# Both run from main only. The role holds AdministratorAccess, and a plan is
# not read-only: it runs the providers and the data sources of whatever code
# it is given. The check below says so in plain words; what enforces it is the
# production environment's deployment-branch rule (main only), because a
# branch can edit this file.
#
# The saved plan itself is never uploaded. A plan file carries the state's
# generated secrets in clear (the database passwords and URLs, the auth
# secrets), and an artifact would keep them in GitHub for weeks. The artifact
# is the rendered plan instead, in which Terraform redacts every sensitive
# value.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan shows what would change; apply changes it"
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  id-token: write
  contents: read

# One group for everything that changes production, this and deploy-app.yml,
# so an apply never runs beside a deploy. A new run waits for the one in
# progress. GitHub keeps only the newest waiting run in a group and cancels an
# older waiting one, but never a run already going.
concurrency:
  group: healdesk-aws-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  terraform:
    name: terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    # shell named so every script runs with -e and -o pipefail; the default
    # shell has no pipefail.
    defaults:
      run:
        shell: bash
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail in plain words before anything else does it in AWS's.
      - name: Check the run
        env:
          ACTION: ${{ inputs.action }}
          TERRAFORM_ROLE: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_KEY: ${{ vars.TF_STATE_KMS_KEY_ARN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=""
          [ -n "$TERRAFORM_ROLE" ] || missing="$missing AWS_TERRAFORM_ROLE_ARN"
          [ -n "$STATE_BUCKET" ] || missing="$missing TF_STATE_BUCKET"
          [ -n "$STATE_KEY" ] || missing="$missing TF_STATE_KMS_KEY_ARN"
          if [ -n "$missing" ]; then
            echo "::error::Set the GitHub variable(s)$missing from the outputs of the healdesk-bootstrap stack (infra/aws/bootstrap/bootstrap.yaml)."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set the GitHub secret CLOUDFLARE_API_TOKEN (Zone:DNS:Edit on healdesk.io): Terraform writes the app.healdesk.io records."
            exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::infra.yml runs from main only ($ACTION was started on $GITHUB_REF): the role it assumes can change anything in the account. Merge first; CI's infra job checks fmt and validate on pull requests."
            exit 1
          fi

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          # The wrapper re-prints every command's output as step outputs; the
          # plan's exit code is read directly below.
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          role-session-name: healdesk-terraform-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          # The account designated under the AWS BAA; credentials for any
          # other account stop the job here.
          allowed-account-ids: "865780386982"

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      # The bucket and the key come from the bootstrap stack; everything else
      # about the backend is in backend.tf. readonly: production gets exactly
      # the provider builds .terraform.lock.hcl pins, as CI does.
      - name: terraform init
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_KEY: ${{ vars.TF_STATE_KMS_KEY_ARN }}
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="kms_key_id=$STATE_KEY"

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        id: plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          terraform plan -input=false -lock-timeout=5m -var-file=production.tfvars \
            -out=tfplan -detailed-exitcode
          code=$?
          set -e
          case "$code" in
            0) echo "changes=false" >>"$GITHUB_OUTPUT" ;;
            2) echo "changes=true" >>"$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac
          terraform show -no-color tfplan >plan.txt
          {
            echo "### terraform plan ($GITHUB_REF_NAME, ${GITHUB_SHA:0:12})"
            echo
            grep -E '^(Plan:|No changes\.)' plan.txt || true
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload the rendered plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: infra/aws/plan.txt
          if-no-files-found: error
          retention-days: 30

      - name: terraform apply
        if: ${{ inputs.action == 'apply' && steps.plan.outputs.changes == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform apply -input=false -lock-timeout=5m tfplan

      - name: Nothing to apply
        if: ${{ inputs.action == 'apply' && steps.plan.outputs.changes == 'false' }}
        run: echo "::notice::The plan found no changes, so nothing was applied."

      # What the next steps need: github_deploy_role_arn for the
      # AWS_DEPLOY_ROLE_ARN variable, and parameters_to_fill for the owner.
      # Printed after every apply, changes or not, so a re-run shows them
      # again. Sensitive outputs print as <sensitive>.
      - name: terraform output
        if: ${{ inputs.action == 'apply' }}
        run: |
          {
            echo "### terraform output"
            echo
            echo '```'
            terraform output -no-color
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
