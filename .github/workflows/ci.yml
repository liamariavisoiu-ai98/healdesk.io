name: CI

# The 71 tests that decide whether this product may hold patient data — tenant
# isolation, RLS drift, BAA immutability, provisioning, sync — silently
# describe.skip when TEST_APP_URL is unset. Locally that is a convenience. With
# no CI it meant they had effectively never run in a clean environment, and a
# suite that skips the security tests while reporting green is worse than no
# suite: it is a suite that lies.
#
# This job exists to make that impossible. It provisions the two-role Postgres
# the security model depends on, runs the migrations, and fails if the
# database-backed tests do not actually execute.

# check/** branches run the same job off the main line: an integration of
# several packages is pushed there, checked here in about 13 minutes instead
# of an hour on a loaded workstation, and only a green one moves to main.
# workflow_dispatch reruns it on any branch. Nothing deploys from CI: the
# deploy, host and infra workflows are manual, and apps/web/vercel.json keeps
# Vercel from building check/** branches.
on:
  push:
    branches: [main, "check/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healdesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # sslmode=disable is correct here and nowhere else: the database is a
      # service container on the same host, and src/db/index.ts warns loudly if
      # this is ever set in production.
      MIGRATION_DATABASE_URL: postgres://healdesk_migrator:ci@localhost:5432/healdesk_test?sslmode=disable
      TEST_MIGRATOR_URL: postgres://healdesk_migrator:ci@localhost:5432/healdesk_test?sslmode=disable
      TEST_APP_URL: postgres://healdesk_app:ci@localhost:5432/healdesk_test?sslmode=disable
      DATABASE_URL: postgres://healdesk_app:ci@localhost:5432/healdesk_test?sslmode=disable
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret
      HEALDESK_PROVISION_SECRET: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The two roles are the security model. Running the tests as one
      # superuser would make every isolation assertion pass for the wrong
      # reason — the runtime role must be provably NOBYPASSRLS.
      - name: Provision database roles
        env:
          PGPASSWORD: postgres
          MIGRATOR_PASSWORD: ci
          APP_PASSWORD: ci
        run: |
          psql -h localhost -U postgres -d healdesk_test \
            -v migrator_password=ci -v app_password=ci \
            -f apps/app/scripts/provision-roles.sql

      - name: Generate a KEK for the test suite
        run: echo "HEALDESK_LOCAL_KEK=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - run: npm run db:migrate -w @healdesk/app

      - run: npx tsc --noEmit -p apps/app
      - run: npx tsc --noEmit -p apps/web
      - run: npx tsc --noEmit -p packages/catalog
      - run: npx tsc --noEmit -p packages/connectors

      # Lint runs here because nothing else did: Next 16 removed `next lint`,
      # and `npm run lint` failed before checking a file without anyone
      # noticing. Errors fail the job; warnings do not. Through turbo, so a
      # workspace that adds a lint script is covered without editing this file.
      - run: npm run lint

      # One run, machine-readable. The previous version ran the suite twice —
      # once for humans, once to grep the count out of coloured terminal output,
      # which failed because the ANSI escapes sit between "Tests" and the number.
      # Parsing a reporter's prose was the mistake; vitest emits JSON. The dot
      # reporter runs beside it so a failing test is named in the log: with the
      # JSON reporter alone a red run said only "exit code 1", and the report
      # that named the test stayed on the runner.
      - name: Test — apps/app
        run: npm test -w @healdesk/app -- --reporter=dot --reporter=json --outputFile.json=../../test-results.json

      # The point of the whole job. The step above fails on any failing test;
      # this one fails when the database-backed suites SKIPPED — which is the
      # silent case, because a suite that skips reports green. The suites that
      # need no database now pass well over any floor on their own (1,297
      # passed beside 779 skipped without one), so a pass count cannot tell;
      # any skipped or todo test fails the job instead. Nothing in apps/app
      # skips on purpose: the only conditional skip is describeDb.
      # apps/app/tests/ci-db-guard.test.ts runs this script.
      - name: Assert the security tests actually ran
        run: |
          node -e '
            const r = require("./test-results.json");
            const passed = r.numPassedTests ?? 0;
            const pending = r.numPendingTests ?? 0;
            const todo = r.numTodoTests ?? 0;
            console.log(`passed: ${passed}, pending: ${pending}, todo: ${todo}`);
            if (pending > 0 || todo > 0 || passed < 200) {
              console.log("::error::" + passed + " tests passed, " + pending + " skipped, " + todo + " todo. The database-backed suites did not all run —");
              console.log("::error::tenant isolation, RLS drift, BAA immutability and billing may not have executed.");
              process.exit(1);
            }
          '

      - name: Test — packages/connectors
        run: npm test -w @healdesk/connectors

      # The catalog's own tests pin what each package includes and what its
      # overage costs. No other suite fails when a rate lands on a package
      # without the channel, so they run here rather than only by hand.
      - name: Test — packages/catalog
        run: npm test -w @healdesk/catalog

      - name: Test — apps/web
        run: npm test -w @healdesk/web

      - run: npm run build
        env:
          HEALDESK_LOCAL_KEK: ${{ env.HEALDESK_LOCAL_KEK }}

      # Until 6 October 2026 every production build of apps/app carried the two
      # AWS SDKs as `throw MODULE_NOT_FOUND`: neither was installed, and inside
      # a try block Turbopack compiles an import it cannot resolve into a throw
      # and passes the build with a warning. No deployment could seal a
      # credential through KMS or send mail through SES, and nothing failed.
      # tests/aws-sdk-clients.test.ts and tests/aws-sdk-externals.test.ts hold
      # the source side of the fix; this reads what the build produced. A
      # missing build fails too, so the check cannot pass by having nothing to
      # look at.
      #
      # The server chunks do not require the packages by name: each SDK is
      # required as a hashed alias (`@aws-sdk/client-kms-<hash>`) that resolves
      # only through a symlink in the standalone output's own .next/node_modules.
      # So the last check loads every SDK module the chunks name, as the server
      # would, from a copy of the standalone output outside the checkout. Inside
      # it, Node's lookup walks up past the standalone output into the build's
      # own aliases and the repo's node_modules, and finds whatever the image
      # would be missing.
      #
      # @aws-sdk/client-s3 is in serverExternalPackages but deliberately not
      # checked here: no Next route loads it, so no server chunk requires it
      # and this step would fail. Only scripts/patient-export.ts uses it
      # (lib/patient-rights/export-store.ts), run by tsx from the image's whole
      # workspace node_modules, outside the Next build. Its source side is held
      # by tests/aws-sdk-externals.test.ts (a runtime dependency, imported by a
      # literal specifier outside any try). If a route ever imports it, add it
      # to the two lists and the pattern below.
      - name: Assert the apps/app build loads the AWS SDKs rather than throwing
        run: |
          test -d apps/app/.next/server && test -d apps/app/.next/standalone || { echo "::error::apps/app/.next/server or .next/standalone is missing: apps/app was not built."; exit 1; }
          failed=0
          for pkg in client-kms client-sesv2; do
            if grep -rlF "Cannot find module '@aws-sdk/$pkg'" apps/app/.next/server; then
              echo "::error::The apps/app server build throws MODULE_NOT_FOUND for @aws-sdk/$pkg (files above)."
              failed=1
            fi
            if [ ! -f "apps/app/.next/standalone/node_modules/@aws-sdk/$pkg/package.json" ]; then
              echo "::error::@aws-sdk/$pkg is not in the apps/app standalone output, so the image would not carry it."
              failed=1
            fi
          done
          copy="$RUNNER_TEMP/apps-app-standalone"
          rm -rf "$copy" && cp -a apps/app/.next/standalone "$copy"
          server="$copy/apps/app/.next/server"
          specs=$(grep -rhoE --include='*.js' '"@aws-sdk/client-(kms|sesv2)(-[0-9a-f]+)?"' "$server" | tr -d '"' | sort -u || true)
          for pkg in client-kms client-sesv2; do
            if ! grep -qE "^@aws-sdk/$pkg(-[0-9a-f]+)?\$" <<< "$specs"; then
              echo "::error::No apps/app server chunk requires @aws-sdk/$pkg, so nothing in the image loads it."
              failed=1
            fi
          done
          for spec in $specs; do
            if ! node -e 'require(require.resolve(process.argv[1], { paths: [process.argv[2]] }))' "$spec" "$server"; then
              echo "::error::$spec, as the apps/app server chunks require it, does not load from the standalone output."
              failed=1
            fi
          done
          exit "$failed"

  # The Terraform for the product host (infra/aws) is applied only by hand,
  # through infra.yml, so a formatting slip, a broken reference or a broken
  # rule would otherwise surface for the first time in front of production.
  # This needs no AWS credentials and no state: init without a backend only
  # downloads the providers, validate checks the configuration against their
  # schemas, and terraform test plans the whole module against mocked
  # providers (infra/aws/tests), so the preconditions, the variable
  # validations and the policies the tests assert are exercised without an
  # account. It runs beside the test job, not after it.
  infra:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - run: terraform fmt -check -recursive -diff

      # readonly: exactly the provider builds .terraform.lock.hcl pins, checked
      # against its hashes. A change that needs any other build fails here
      # instead of quietly getting a newer one.
      - run: terraform init -backend=false -input=false -lockfile=readonly

      - run: terraform validate -no-color

      # The module's two providers, aws and cloudflare, are both mocked in the
      # suite, so nothing here can reach AWS or Cloudflare, and none of their
      # credentials exist in this job to be reached with.
      - run: terraform test -no-color
