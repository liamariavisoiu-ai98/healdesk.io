name: CI

# The 71 tests that decide whether this product may hold patient data — tenant
# isolation, RLS drift, BAA immutability, provisioning, sync — silently
# describe.skip when TEST_APP_URL is unset. Locally that is a convenience. With
# no CI it meant they had effectively never run in a clean environment, and a
# suite that skips the security tests while reporting green is worse than no
# suite: it is a suite that lies.
#
# This job exists to make that impossible. It provisions the two-role Postgres
# the security model depends on, runs the migrations, and fails if the
# database-backed tests do not actually execute.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healdesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # sslmode=disable is correct here and nowhere else: the database is a
      # service container on the same host, and src/db/index.ts warns loudly if
      # this is ever set in production.
      MIGRATION_DATABASE_URL: postgres://healdesk_migrator:ci@localhost:5432/healdesk_test?sslmode=disable
      TEST_MIGRATOR_URL: postgres://healdesk_migrator:ci@localhost:5432/healdesk_test?sslmode=disable
      TEST_APP_URL: postgres://healdesk_app:ci@localhost:5432/healdesk_test?sslmode=disable
      DATABASE_URL: postgres://healdesk_app:ci@localhost:5432/healdesk_test?sslmode=disable
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret
      HEALDESK_PROVISION_SECRET: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The two roles are the security model. Running the tests as one
      # superuser would make every isolation assertion pass for the wrong
      # reason — the runtime role must be provably NOBYPASSRLS.
      - name: Provision database roles
        env:
          PGPASSWORD: postgres
          MIGRATOR_PASSWORD: ci
          APP_PASSWORD: ci
        run: |
          psql -h localhost -U postgres -d healdesk_test \
            -v migrator_password=ci -v app_password=ci \
            -f apps/app/scripts/provision-roles.sql

      - name: Generate a KEK for the test suite
        run: echo "HEALDESK_LOCAL_KEK=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - run: npm run db:migrate -w @healdesk/app

      - run: npx tsc --noEmit -p apps/app
      - run: npx tsc --noEmit -p apps/web
      - run: npx tsc --noEmit -p packages/catalog
      - run: npx tsc --noEmit -p packages/connectors

      # One run, machine-readable. The previous version ran the suite twice —
      # once for humans, once to grep the count out of coloured terminal output,
      # which failed because the ANSI escapes sit between "Tests" and the number.
      # Parsing a reporter's prose was the mistake; vitest emits JSON.
      - name: Test — apps/app
        run: npm test -w @healdesk/app -- --reporter=json --outputFile=../../test-results.json

      # The point of the whole job. The step above fails on any failing test;
      # this one fails when the database-backed suites SKIPPED — which is the
      # silent case, because a suite that skips reports green. The suites that
      # need no database now pass well over any floor on their own (1,297
      # passed beside 779 skipped without one), so a pass count cannot tell;
      # any skipped or todo test fails the job instead. Nothing in apps/app
      # skips on purpose: the only conditional skip is describeDb.
      # apps/app/tests/ci-db-guard.test.ts runs this script.
      - name: Assert the security tests actually ran
        run: |
          node -e '
            const r = require("./test-results.json");
            const passed = r.numPassedTests ?? 0;
            const pending = r.numPendingTests ?? 0;
            const todo = r.numTodoTests ?? 0;
            console.log(`passed: ${passed}, pending: ${pending}, todo: ${todo}`);
            if (pending > 0 || todo > 0 || passed < 200) {
              console.log("::error::" + passed + " tests passed, " + pending + " skipped, " + todo + " todo. The database-backed suites did not all run —");
              console.log("::error::tenant isolation, RLS drift, BAA immutability and billing may not have executed.");
              process.exit(1);
            }
          '

      - name: Test — packages/connectors
        run: npm test -w @healdesk/connectors

      # The catalog's own tests pin what each package includes and what its
      # overage costs. No other suite fails when a rate lands on a package
      # without the channel, so they run here rather than only by hand.
      - name: Test — packages/catalog
        run: npm test -w @healdesk/catalog

      - name: Test — apps/web
        run: npm test -w @healdesk/web

      - run: npm run build
        env:
          HEALDESK_LOCAL_KEK: ${{ env.HEALDESK_LOCAL_KEK }}
