name: Demo eval

# The demo call, scored on a real model before and after every change to it
# (owner, 31 October 2026: "a small set of real-model test calls scored on
# every change"; review items 19 and 20: the regression cases script the
# model's replies, so a change could pass every test and still sound worse on
# a real call, as PR 77 did). Eight simulated clinic owners call the real demo
# pipeline (apps/app/scripts/voice-eval/demo) twice each on the production
# voice model, first on the pull request's base and then on its head, and a
# judge grades both; the summary shows the two side by side, and the job fails
# when the head is worse past the noise.
#
# Synthetic calls only, about a made-up clinic: no patient, no clinic's data.
# It spends the eval's own Anthropic key, VOICE_EVAL_ANTHROPIC_API_KEY (an
# Actions secret the owner adds; never the patient-data organisation's
# ANTHROPIC_API_KEY), within VOICE_EVAL_DEMO_BUDGET_USD per run (a repository
# variable; 5 when unset). Without the secret the job only says it skipped:
# it is not a required check until the owner makes it one in branch
# protection. Pull requests from forks get no secrets and skip too.

on:
  pull_request:
    paths:
      - "apps/app/src/lib/voice/**"
      - "apps/app/src/lib/assistant/**"
      - "apps/app/scripts/voice-eval/**"
      - "packages/catalog/src/**"
      - ".github/workflows/demo-eval.yml"
  workflow_dispatch:
    inputs:
      reps:
        description: "Calls per scenario"
        default: "2"

permissions:
  contents: read

concurrency:
  group: demo-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: demo eval (real model)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VOICE_EVAL_ANTHROPIC_API_KEY: ${{ secrets.VOICE_EVAL_ANTHROPIC_API_KEY }}
      VOICE_EVAL_DEMO_BUDGET_USD: ${{ vars.VOICE_EVAL_DEMO_BUDGET_USD || '5' }}
      REPS: ${{ github.event.inputs.reps || '2' }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Skip without the eval's key
        if: env.VOICE_EVAL_ANTHROPIC_API_KEY == ''
        run: |
          echo "### Demo eval skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "No VOICE_EVAL_ANTHROPIC_API_KEY secret: add the eval's own Anthropic key as an Actions secret to score the demo on a real model." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: env.VOICE_EVAL_ANTHROPIC_API_KEY != ''
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: env.VOICE_EVAL_ANTHROPIC_API_KEY != ''
        with:
          node-version: 24
          cache: npm

      - name: Install
        if: env.VOICE_EVAL_ANTHROPIC_API_KEY != ''
        run: npm ci --no-audit --no-fund

      # Before: the base's own demo, when the base has the eval. On the
      # change that adds it there is nothing to compare with yet.
      - name: Score the base
        if: env.VOICE_EVAL_ANTHROPIC_API_KEY != '' && env.BASE_SHA != ''
        run: |
          git worktree add /tmp/base "$BASE_SHA"
          if [ -f /tmp/base/apps/app/scripts/voice-eval/demo/cli.ts ]; then
            (cd /tmp/base && npm ci --no-audit --no-fund && npm run voice-eval:demo -w @healdesk/app -- run --reps "$REPS" --out /tmp/eval-before --write-baseline /tmp/before.json)
          else
            echo "The base has no demo eval: nothing to compare with." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Score this change
        if: env.VOICE_EVAL_ANTHROPIC_API_KEY != ''
        run: |
          compare=""
          if [ -f /tmp/before.json ]; then compare="--baseline /tmp/before.json --fail-on-worse"; fi
          set +e
          npm run voice-eval:demo -w @healdesk/app -- run --reps "$REPS" --out /tmp/eval-after $compare
          status=$?
          set -e
          cat /tmp/eval-after/report.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $status

      - name: Keep the transcripts
        if: always() && env.VOICE_EVAL_ANTHROPIC_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: demo-eval
          path: |
            /tmp/eval-before
            /tmp/eval-after
          if-no-files-found: ignore
          retention-days: 14
