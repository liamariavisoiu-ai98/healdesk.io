name: Deploy apps/app (AWS)

# Builds apps/app and its two helper images, migrates the database and rolls
# the web service on ECS, the worker service when the worker has its own
# (infra/aws, worker_placement = "separate"; by default it is a container in
# the web task and moves with it), and the Retell voice endpoint's service
# when enable_voice has made one, by hand, from main, or called by host.yml
# after the apply that turns the host on (with bootstrap_db and migrate). It
# runs as the Terraform-made role healdesk-production-github-deploy
# (AWS_DEPLOY_ROLE_ARN, or derived from AWS_TERRAFORM_ROLE_ARN's account when
# that is unset), assumed with GitHub's OIDC token, and AWS gives that role
# only to a run of this repository on
# main started by the owner: the role's trust policy (infra/aws/iam.tf) checks
# the token's subject, ref and actor_id, as the Terraform role's does. That
# policy is the control, not the checks below, which live in a file a branch
# can edit. No job names a GitHub environment: one that did would get a
# different subject and be refused. No AWS key is stored anywhere, and no
# database credential ever reaches GitHub: the migrations run inside the VPC
# as a one-off task that reads its own secret.
#
# The role is as powerful as the code it deploys: a revision it registers and
# runs receives every secret its task definition names. So before anything is
# registered or rolled back to, each task definition is checked against the
# shape Terraform gives it (its containers, its roles, the variables no app
# task may carry), and one shaped otherwise stops the run.
#
#   bootstrap_db  Run db-bootstrap first, as the RDS master user: it fills in
#                 the internal secrets still unset in Parameter Store (the
#                 database passwords and URLs, the auth secrets; a value
#                 already set is never replaced), then creates the two
#                 database roles, or re-sets their passwords, from them. The
#                 first deploy must, since nothing can connect before it has
#                 run; later, only to re-set the role passwords.
#   migrate       Run the migrations and the queue install before the services
#                 move. The first deploy must.
#   restart_only  Build and migrate nothing: start fresh tasks of the revisions
#                 already running, so they read their parameters again (after
#                 a value is pasted into Parameter Store). A change Terraform
#                 makes to a task definition reaches the services with the
#                 next full deploy, not with a restart.
#   rollback_to   A commit SHA (7 to 40 hex characters; give the one a past
#                 deploy's summary names). Build and migrate nothing: put web,
#                 worker and voice back on the newest revisions that ran that
#                 commit, provided they are still active and their images
#                 still in ECR (the last 30 per repository are kept). Never
#                 Terraform's own revisions, whose placeholder image was never
#                 pushed. Those revisions carry the configuration of their
#                 day, so rolling back past a Terraform change undoes it on
#                 the services until the next full deploy. The schema stays
#                 where it is: migrations only add, which keeps older code
#                 working. Then make main match (git revert) before the next
#                 deploy, or it brings the bad commit back.
#
# Everything is found at run time rather than copied in: the registry from
# the account, each task definition from its family's latest revision (which
# Terraform writes), the subnets and security group for one-off tasks from
# the web service, where the worker runs and whether voice is on from which
# services exist, and the platform to build for from the web task
# definition's CPU architecture (task_cpu_architecture: ARM64 by default,
# built here under emulation). The workflow swaps images and registers new
# revisions; Terraform owns everything else about them.
#
# The voice service is waited for less than the others. Its replaced tasks
# drain their calls for up to an hour before ECS stops them (the target
# group's deregistration delay, infra/aws/alb.tf), so every mode waits only
# until its new tasks serve, and leaves the old ones to finish on their own.
#
# Nothing this job prints comes from inside a container. A one-off task that
# fails is reported by its exit code and ECS's stopped reason, with the name of
# its log stream. What it wrote (migration errors can quote SQL and row
# values) stays in CloudWatch, under the product key.

on:
  workflow_dispatch:
    inputs:
      bootstrap_db:
        description: "Run db-bootstrap first: fill in unset internal secrets, then create the database roles (the first deploy must)"
        type: boolean
        default: false
      migrate:
        description: "Run the migrations and the queue install before the services move"
        type: boolean
        default: true
      restart_only:
        description: "Only restart the services (web, worker, voice) so they re-read their parameters (no build, no migrations)"
        type: boolean
        default: false
      rollback_to:
        description: "Roll the services (web, worker, voice) back to the revisions of this commit SHA (no build, no migrations); empty for a deploy"
        type: string
        default: ""
  # host.yml calls this after its apply, with bootstrap_db and migrate, the
  # same inputs a hand-started run takes. The caller grants id-token: write.
  workflow_call:
    inputs:
      bootstrap_db:
        type: boolean
        default: false
      migrate:
        type: boolean
        default: true
      restart_only:
        type: boolean
        default: false
      rollback_to:
        type: string
        default: ""
      # Never set by a caller: its default is what tells a called run from a
      # dispatched one below. A dispatched run has no such input, so it reads
      # as false.
      called_by_host:
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

# Shared with infra.yml and host.yml: one change to production at a time. A
# new run waits for the one in progress; GitHub keeps only the newest waiting
# run in a group. Called from host.yml, this run is part of one that already
# holds the group, and a called workflow that asked for its caller's group
# would wait for its own caller to finish, for ever. So a called run takes a
# group of its own, named after the caller's run, and the caller's hold on
# healdesk-aws-production is what keeps everything else out meanwhile.
concurrency:
  group: ${{ inputs.called_by_host && format('healdesk-aws-production-called-{0}', github.run_id) || 'healdesk-aws-production' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # The account designated under the AWS BAA. Credentials for any other
  # account stop the job before it touches anything.
  AWS_ACCOUNT_ID: "865780386982"
  CLUSTER: healdesk-production
  WEB_SERVICE: healdesk-production-web
  WORKER_SERVICE: healdesk-production-worker
  VOICE_SERVICE: healdesk-production-voice
  MIGRATE_FAMILY: healdesk-production-migrate
  DB_BOOTSTRAP_FAMILY: healdesk-production-db-bootstrap
  DESTROY_DUE_FAMILY: healdesk-production-destroy-due
  PATIENT_EXPORT_FAMILY: healdesk-production-patient-export
  ERASE_PERSON_FAMILY: healdesk-production-erase-person
  AMEND_CONTACT_FAMILY: healdesk-production-amend-contact
  REAPPLY_ERASURES_FAMILY: healdesk-production-reapply-erasures
  APP_URL: https://app.healdesk.io
  # ECR tags are immutable, so the commit names one image for good.
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: ${{ inputs.rollback_to != '' && 'rollback' || (inputs.restart_only && 'restart' || 'deploy') }}
    # An x86_64 runner. The images are built for the platform the task
    # definitions declare (see "Read the services"), under QEMU when that is
    # arm64, so the native modules npm installs in the image are the ones
    # Fargate runs.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Named explicitly so every script runs with -e and -o pipefail; the
    # default shell has no pipefail.
    defaults:
      run:
        shell: bash
    steps:
      # The mode decides every later step: deploy (build, migrate, roll),
      # restart or rollback (neither builds nor migrates).
      - name: Check the run
        id: run
        env:
          BOOTSTRAP_DB: ${{ inputs.bootstrap_db }}
          RESTART_ONLY: ${{ inputs.restart_only }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
          DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          TERRAFORM_ROLE: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
        run: |
          # The deploy role's name is fixed by Terraform (iam.tf), so without
          # the variable it is derived from the Terraform role's account (the
          # variable was never set, and the connector that edits this
          # repository cannot set variables). Either way it must be in the
          # account designated under the BAA.
          if [ -z "$DEPLOY_ROLE" ]; then
            account=""
            if [[ "$TERRAFORM_ROLE" =~ ^arn:aws:iam::([0-9]{12}):role/ ]]; then
              account=${BASH_REMATCH[1]}
            fi
            if [ -z "$account" ]; then
              echo "::error::Set the GitHub variable AWS_TERRAFORM_ROLE_ARN (the bootstrap stack's TerraformRoleArn output): without AWS_DEPLOY_ROLE_ARN, the deploy role is found in its account."
              exit 1
            fi
            DEPLOY_ROLE="arn:aws:iam::$account:role/healdesk-production-github-deploy"
            echo "AWS_DEPLOY_ROLE_ARN is not set: using $DEPLOY_ROLE"
          fi
          if [[ ! "$DEPLOY_ROLE" =~ ^arn:aws:iam::$AWS_ACCOUNT_ID:role/ ]]; then
            echo "::error::The deploy role $DEPLOY_ROLE is not in account $AWS_ACCOUNT_ID, the one designated under the AWS BAA."
            exit 1
          fi
          echo "deploy_role=$DEPLOY_ROLE" >>"$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Production deploys run from main only, and AWS gives the deploy role to no other branch; this run is on $GITHUB_REF."
            exit 1
          fi
          # The deploy role trusts the owner's runs alone (actor_id); if it ever
          # names someone else, this check has to follow.
          if [ "$GITHUB_ACTOR_ID" != "$GITHUB_REPOSITORY_OWNER_ID" ]; then
            echo "::error::AWS gives the deploy role only to runs the repository owner starts, and $GITHUB_ACTOR started this one. Start it as the owner."
            exit 1
          fi
          mode=deploy
          commit=""
          # Anything typed in rollback_to means a rollback (the job's name says
          # so too), so a value that is not a SHA stops the run rather than
          # falling through to a deploy.
          if [ -n "$ROLLBACK_TO" ]; then
            commit=$(tr -d '[:space:]' <<<"$ROLLBACK_TO" | tr '[:upper:]' '[:lower:]')
            if ! [[ "$commit" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "::error::rollback_to takes a commit SHA, 7 to 40 hex characters."
              exit 1
            fi
            mode=rollback
          fi
          if [ "$RESTART_ONLY" = true ]; then
            if [ "$mode" = rollback ]; then
              echo "::error::Choose restart_only or rollback_to, not both."
              exit 1
            fi
            mode=restart
          fi
          if [ "$mode" != deploy ] && [ "$BOOTSTRAP_DB" = true ]; then
            echo "::error::A $mode builds and migrates nothing, so it cannot bootstrap the database. Untick bootstrap_db."
            exit 1
          fi
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          echo "rollback_to=$commit" >>"$GITHUB_OUTPUT"
          echo "Mode: $mode"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.run.outputs.mode == 'deploy' }}
        with:
          persist-credentials: false

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.run.outputs.deploy_role }}
          role-session-name: healdesk-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      # Terraform creates the services at 0 tasks, so nothing crash-loops
      # before an image exists. All of them still at 0 means nothing has been
      # deployed: this run must bootstrap the database and migrate, and
      # brings each service up, after the migrations have passed, to the
      # count Terraform records in its DesiredCount tag (web_desired,
      # worker_desired and voice_desired, 1 by default). A service found at 0
      # beside a running one is brought up the same way; one already running
      # keeps its count.
      #
      # The worker service exists only when the worker has its own
      # (worker_placement = "separate"). Missing, the worker is the web
      # task's "worker" container, which "Check the task definitions" then
      # requires, so a web task with no worker anywhere is refused.
      #
      # The voice service exists only while enable_voice is on. Missing, voice
      # is off and every voice step is skipped; found, it moves in every mode
      # with web and worker. Just switched on, it is the service at 0 beside
      # running ones that the next deploy brings up.
      - name: Read the services
        id: services
        env:
          MODE: ${{ steps.run.outputs.mode }}
          MIGRATE: ${{ inputs.migrate }}
          BOOTSTRAP_DB: ${{ inputs.bootstrap_db }}
        run: |
          describe() {
            aws ecs describe-services --cluster "$CLUSTER" \
              --services "$WEB_SERVICE" "$WORKER_SERVICE" "$VOICE_SERVICE" --output json "$@"
          }
          if ! out=$(describe --include TAGS 2>"$RUNNER_TEMP/describe.err"); then
            if ! grep -q AccessDenied "$RUNNER_TEMP/describe.err"; then
              cat "$RUNNER_TEMP/describe.err" >&2
              exit 1
            fi
            echo "::warning::The deploy role cannot read the services' tags, so a first deploy starts one task of each."
            out=$(describe)
          fi
          active() { jq -r --arg name "$1" '[.services[] | select(.serviceName == $name and .status == "ACTIVE")] | length' <<<"$out"; }
          draining() { jq -e --arg name "$1" '[.services[] | select(.serviceName == $name and .status == "DRAINING")] | length > 0' <<<"$out" >/dev/null; }
          if [ "$(active "$WEB_SERVICE")" != 1 ]; then
            echo "::error::$CLUSTER has no active $WEB_SERVICE: the host is in standby, or has never been applied. Turn it on with host.yml (mode active), which applies and then runs this deploy itself."
            jq -r '.failures[]? | "  \(.arn): \(.reason)"' <<<"$out"
            exit 1
          fi
          worker_shared=false
          if [ "$(active "$WORKER_SERVICE")" != 1 ]; then
            # Missing, or deleted (ECS lists a deleted service as INACTIVE for
            # a while), means "shared". One still DRAINING is being deleted by
            # an apply that has not finished.
            if draining "$WORKER_SERVICE"; then
              echo "::error::$WORKER_SERVICE is still being deleted. Wait for the infra.yml apply that removed it, then deploy."
              exit 1
            fi
            worker_shared=true
          fi
          # The same for voice: missing or INACTIVE means off. DRAINING can
          # last up to an hour here, while the deleted service's calls finish.
          voice_on=true
          if [ "$(active "$VOICE_SERVICE")" != 1 ]; then
            if draining "$VOICE_SERVICE"; then
              echo "::error::$VOICE_SERVICE is still being deleted (its calls drain for up to an hour). Wait for the infra.yml apply that removed it, then deploy."
              exit 1
            fi
            voice_on=false
          fi
          field() { jq -er --arg name "$1" ".services[] | select(.serviceName == \$name) | $2" <<<"$out"; }
          first_count() {
            local tag
            tag=$(jq -r --arg name "$1" '.services[] | select(.serviceName == $name)
              | (.tags // [])[] | select(.key == "DesiredCount") | .value' <<<"$out")
            if [[ "$tag" =~ ^[1-9][0-9]*$ ]]; then echo "$tag"; else echo 1; fi
          }
          family='.taskDefinition | split("/")[1] | split(":")[0]'
          network='.networkConfiguration.awsvpcConfiguration'
          web_desired=$(field "$WEB_SERVICE" .desiredCount)
          web_family=$(field "$WEB_SERVICE" "$family")
          if [ "$worker_shared" = true ]; then
            worker_desired=0
            worker_family=""
          else
            worker_desired=$(field "$WORKER_SERVICE" .desiredCount)
            worker_family=$(field "$WORKER_SERVICE" "$family")
          fi
          if [ "$voice_on" = true ]; then
            voice_desired=$(field "$VOICE_SERVICE" .desiredCount)
            voice_family=$(field "$VOICE_SERVICE" "$family")
          else
            voice_desired=0
            voice_family=""
          fi
          # Terraform's newest web revision says which CPU the tasks run on;
          # every task definition declares the same one (infra/aws).
          architecture=$(aws ecs describe-task-definition --task-definition "$web_family" \
            --query 'taskDefinition.runtimePlatform.cpuArchitecture' --output text)
          case "$architecture" in
            ARM64) platform=linux/arm64 ;;
            X86_64 | None) architecture=X86_64; platform=linux/amd64 ;;
            *)
              echo "::error::$web_family declares CPU architecture $architecture, which this workflow does not build for."
              exit 1
              ;;
          esac
          subnets=$(field "$WEB_SERVICE" "$network.subnets | join(\",\")")
          security_groups=$(field "$WEB_SERVICE" "$network.securityGroups | join(\",\")")
          if [ -z "$subnets" ] || [ -z "$security_groups" ]; then
            echo "::error::$WEB_SERVICE has no subnets or security group to give the one-off tasks."
            exit 1
          fi
          first_deploy=false
          if [ "$web_desired" = 0 ] && [ "$worker_desired" = 0 ] && [ "$voice_desired" = 0 ]; then first_deploy=true; fi
          {
            echo "web_family=$web_family"
            echo "worker_family=$worker_family"
            echo "worker_shared=$worker_shared"
            echo "voice_family=$voice_family"
            echo "voice_on=$voice_on"
            echo "web_desired=$web_desired"
            echo "worker_desired=$worker_desired"
            echo "voice_desired=$voice_desired"
            echo "web_count=$([ "$web_desired" != 0 ] || first_count "$WEB_SERVICE")"
            if [ "$worker_shared" = false ]; then
              echo "worker_count=$([ "$worker_desired" != 0 ] || first_count "$WORKER_SERVICE")"
            fi
            if [ "$voice_on" = true ]; then
              echo "voice_count=$([ "$voice_desired" != 0 ] || first_count "$VOICE_SERVICE")"
            fi
            echo "first_deploy=$first_deploy"
            echo "subnets=$subnets"
            echo "security_groups=$security_groups"
            echo "architecture=$architecture"
            echo "platform=$platform"
          } >>"$GITHUB_OUTPUT"
          echo "$WEB_SERVICE: $web_desired task(s) desired ($web_family, $architecture)"
          if [ "$worker_shared" = true ]; then
            echo "$WORKER_SERVICE: none; the worker runs inside each web task"
          else
            echo "$WORKER_SERVICE: $worker_desired task(s) desired ($worker_family)"
          fi
          if [ "$voice_on" = true ]; then
            echo "$VOICE_SERVICE: $voice_desired task(s) desired ($voice_family)"
          else
            echo "$VOICE_SERVICE: none; enable_voice is off"
          fi
          if [ "$MODE" != deploy ]; then
            if [ "$web_desired" = 0 ]; then
              echo "::error::Nothing has been deployed yet, so there is nothing to ${MODE/rollback/roll back}. Run a full deploy."
              exit 1
            fi
          elif [ "$first_deploy" = true ]; then
            if [ "$BOOTSTRAP_DB" != true ]; then
              echo "::error::The first deploy must bootstrap the database (tick bootstrap_db): until db-bootstrap has run, the database passwords and URLs are unset and nothing can connect."
              exit 1
            fi
            if [ "$MIGRATE" != true ]; then
              echo "::error::The first deploy must migrate: nothing has run against this database yet."
              exit 1
            fi
          fi

      # ----------------------------------------------------------------- images
      - name: Log in to ECR
        id: ecr
        if: ${{ steps.run.outputs.mode == 'deploy' }}
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # One platform, no attestations: a single image manifest per tag, which
      # is what ECR's scan on push reads and what the lifecycle rule counts.
      # A re-run of the same commit finds its images already pushed and reuses
      # them, since an immutable tag cannot be pushed twice; so the tag names
      # one architecture's image, and changing task_cpu_architecture needs a
      # new commit to deploy, not a re-run of an old one. An arm64 build on
      # this x86_64 runner runs under QEMU, from Ubuntu's own package: slower
      # (the app's npm ci and next build take several times longer) but with
      # no third-party action in the path that builds the PHI host's image.
      - name: Build and push the images
        id: images
        if: ${{ steps.run.outputs.mode == 'deploy' }}
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          PLATFORM: ${{ steps.services.outputs.platform }}
        run: |
          if [ "$PLATFORM" = linux/arm64 ] && [ "$(uname -m)" != aarch64 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq qemu-user-static
            if [ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
              echo "::error::qemu-user-static installed, but no arm64 binfmt handler is registered: an arm64 image cannot be built on this runner."
              exit 1
            fi
          fi
          echo "Building for $PLATFORM"
          build() {
            local output=$1 repo=$2 dockerfile=$3 context=$4
            local ref="$REGISTRY/$repo:$IMAGE_TAG" digest
            if ! digest=$(aws ecr batch-get-image --repository-name "$repo" \
              --image-ids imageTag="$IMAGE_TAG" --query 'images[0].imageId.imageDigest' --output text); then
              echo "::warning::Could not check $repo for an image of this commit; building one."
              digest=""
            fi
            if [[ "$digest" == sha256:* ]]; then
              echo "$ref is already in the registry; reusing it"
            else
              docker buildx build --platform "$PLATFORM" --provenance=false --sbom=false --pull \
                --file "$dockerfile" --tag "$ref" --push "$context"
            fi
            echo "$output=$ref" >>"$GITHUB_OUTPUT"
          }
          build app_image healdesk/app apps/app/Dockerfile .
          build tls_proxy_image healdesk/tls-proxy infra/aws/images/tls-proxy/Dockerfile infra/aws/images/tls-proxy
          build db_admin_image healdesk/db-admin infra/aws/images/db-admin/Dockerfile .

      # The build can use a good part of the first session's hour (the action's
      # default); a fresh one covers the task definitions and the one-off
      # tasks. Each renewal is a new OIDC exchange, so it works even after the
      # session before it has expired.
      - name: Renew the deploy role session
        if: ${{ steps.run.outputs.mode == 'deploy' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.run.outputs.deploy_role }}
          role-session-name: healdesk-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          unset-current-credentials: true

      # ------------------------------------------------------- task definitions
      # The latest revision of each family is Terraform's configuration, or
      # the last deploy's when Terraform has not changed it since. Its tags
      # (ManagedBy = terraform among them) are left behind: the revision this
      # run registers is not Terraform's.
      - name: Fetch the task definitions
        id: taskdefs
        if: ${{ steps.run.outputs.mode == 'deploy' }}
        env:
          WEB_FAMILY: ${{ steps.services.outputs.web_family }}
          WORKER_FAMILY: ${{ steps.services.outputs.worker_family }}
          VOICE_FAMILY: ${{ steps.services.outputs.voice_family }}
          BOOTSTRAP_DB: ${{ inputs.bootstrap_db }}
          MIGRATE: ${{ inputs.migrate }}
        run: |
          fetch() {
            aws ecs describe-task-definition --task-definition "$1" \
              --query taskDefinition --output json >"$RUNNER_TEMP/$2.json"
            echo "$2: from $(jq -r '"\(.family):\(.revision)"' "$RUNNER_TEMP/$2.json")"
          }
          fetch "$WEB_FAMILY" web
          # A shared worker has no family of its own to deploy: it is in web.
          if [ -n "$WORKER_FAMILY" ]; then fetch "$WORKER_FAMILY" worker; fi
          # Voice only while its service exists (enable_voice).
          if [ -n "$VOICE_FAMILY" ]; then fetch "$VOICE_FAMILY" voice; fi
          fetch "$DESTROY_DUE_FAMILY" destroy-due
          fetch "$PATIENT_EXPORT_FAMILY" patient-export
          fetch "$ERASE_PERSON_FAMILY" erase-person
          fetch "$AMEND_CONTACT_FAMILY" amend-contact
          fetch "$REAPPLY_ERASURES_FAMILY" reapply-erasures
          if [ "$MIGRATE" = true ]; then fetch "$MIGRATE_FAMILY" migrate; fi
          if [ "$BOOTSTRAP_DB" = true ]; then fetch "$DB_BOOTSTRAP_FAMILY" db-bootstrap; fi
          # The TLS sidecar is in the web task only while alb_to_task_tls is on,
          # and the worker only while it shares the task.
          if jq -e '.containerDefinitions[] | select(.name == "tls-proxy")' "$RUNNER_TEMP/web.json" >/dev/null; then
            echo "web_has_tls_proxy=true" >>"$GITHUB_OUTPUT"
          fi
          if jq -e '.containerDefinitions[] | select(.name == "worker")' "$RUNNER_TEMP/web.json" >/dev/null; then
            echo "web_has_worker=true" >>"$GITHUB_OUTPUT"
          fi
          if [ -n "$VOICE_FAMILY" ] && jq -e '.containerDefinitions[] | select(.name == "tls-proxy")' "$RUNNER_TEMP/voice.json" >/dev/null; then
            echo "voice_has_tls_proxy=true" >>"$GITHUB_OUTPUT"
          fi

      # For each family, the newest revision that ran the commit asked for and
      # can run it again: ACTIVE (ECS refuses an inactive one), every image in
      # this account's registry, tagged with that one full commit, and still
      # in ECR. Terraform's own revisions never qualify: their placeholder tag
      # is not a commit and was never pushed. Web decides the commit (a short
      # SHA must match exactly one); a worker with its own service, and the
      # voice service, must have run the same one, so no two run different
      # code. A shared worker is a container of the web revision, so it moves
      # with it. Voice switched on after that commit has no revision that ran
      # it, and the rollback stops: roll back to a later commit, or switch
      # voice off first. The last 50 revisions of each family are searched;
      # ECR keeps 30 images, so anything older has lost its image anyway.
      - name: Choose the rollback revisions
        id: rollback
        if: ${{ steps.run.outputs.mode == 'rollback' }}
        env:
          ROLLBACK_TO: ${{ steps.run.outputs.rollback_to }}
          WEB_FAMILY: ${{ steps.services.outputs.web_family }}
          WORKER_FAMILY: ${{ steps.services.outputs.worker_family }}
          VOICE_FAMILY: ${{ steps.services.outputs.voice_family }}
        run: |
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/"
          # The one commit every image of a revision is tagged with; fails
          # unless they are all ours and all carry the same full SHA.
          commit_of() {
            jq -er --arg registry "$registry" '
              [.containerDefinitions[].image] as $images
              | ($images | map(ltrimstr($registry) | split(":") | last) | unique) as $tags
              | select(all($images[]; startswith($registry)) and ($tags | length) == 1)
              | $tags[0] | select(test("^[0-9a-f]{40}$"))' "$1"
          }
          # Prints "<revision> <commit>" for each such revision of a family,
          # newest first, and keeps each one's JSON for the checks below.
          revisions() {
            local family=$1 latest revision file commit
            latest=$(aws ecs describe-task-definition --task-definition "$family" \
              --query taskDefinition.revision --output text)
            for ((revision = latest; revision > 0 && revision > latest - 50; revision--)); do
              file="$RUNNER_TEMP/$family-$revision.json"
              # A revision deleted for good cannot be described: skip it, but
              # stop on any other error rather than search on blind.
              if ! aws ecs describe-task-definition --task-definition "$family:$revision" \
                --query taskDefinition --output json >"$file" 2>"$RUNNER_TEMP/describe.err" </dev/null; then
                grep -q ClientException "$RUNNER_TEMP/describe.err" && continue
                cat "$RUNNER_TEMP/describe.err" >&2
                exit 1
              fi
              [ "$(jq -r .status "$file")" = ACTIVE ] || continue
              commit=$(commit_of "$file") || continue
              echo "$revision $commit"
            done
          }
          images_in_ecr() {
            local image repo tag digest
            while read -r image; do
              repo=${image#"$registry"}
              tag=${repo##*:}
              repo=${repo%:*}
              if ! digest=$(aws ecr batch-get-image --repository-name "$repo" --image-ids imageTag="$tag" \
                --query 'images[0].imageId.imageDigest' --output text </dev/null); then
                echo "::error::Could not look $image up in ECR."
                exit 1
              fi
              if [[ "$digest" != sha256:* ]]; then
                echo "$image is no longer in ECR (the last 30 images per repository are kept)."
                return 1
              fi
            done < <(jq -r '.containerDefinitions[].image' "$1")
          }
          choose() {
            local family=$1 label=$2 commit=$3 hint=${4:-} revision ran
            while read -r revision ran; do
              [ "$ran" = "$commit" ] || continue
              if images_in_ecr "$RUNNER_TEMP/$family-$revision.json"; then
                cp "$RUNNER_TEMP/$family-$revision.json" "$RUNNER_TEMP/$label.json"
                echo "${label}_task_definition=$family:$revision" >>"$GITHUB_OUTPUT"
                echo "$label: $family:$revision ran $commit"
                return 0
              fi
            done <"$RUNNER_TEMP/$label-revisions"
            echo "::error::No $family revision that ran $commit can run it again: none is still ACTIVE with its images in ECR.${hint:+ $hint}"
            exit 1
          }
          revisions "$WEB_FAMILY" >"$RUNNER_TEMP/web-revisions"
          mapfile -t commits < <(awk -v want="$ROLLBACK_TO" 'index($2, want) == 1 { print $2 }' \
            "$RUNNER_TEMP/web-revisions" | sort -u)
          if [ "${#commits[@]}" = 0 ]; then
            echo "::error::No $WEB_FAMILY revision among the last 50 that could run again ran a commit starting $ROLLBACK_TO."
            if [ -s "$RUNNER_TEMP/web-revisions" ]; then
              echo "These could (revision, commit):"
              cat "$RUNNER_TEMP/web-revisions"
            else
              echo "None could: no active revision names this registry's images tagged with a commit."
            fi
            exit 1
          fi
          if [ "${#commits[@]}" != 1 ]; then
            echo "::error::$ROLLBACK_TO matches more than one commit (${commits[*]}). Give more of the SHA."
            exit 1
          fi
          commit=${commits[0]}
          choose "$WEB_FAMILY" web "$commit"
          if [ -n "$WORKER_FAMILY" ]; then
            revisions "$WORKER_FAMILY" >"$RUNNER_TEMP/worker-revisions"
            choose "$WORKER_FAMILY" worker "$commit"
          fi
          if [ -n "$VOICE_FAMILY" ]; then
            revisions "$VOICE_FAMILY" >"$RUNNER_TEMP/voice-revisions"
            choose "$VOICE_FAMILY" voice "$commit" \
              "If voice was switched on after that commit, roll back to a later one that ran voice too, or set enable_voice = false and apply before rolling back."
          fi
          echo "commit=$commit" >>"$GITHUB_OUTPUT"

      # Defence in depth behind the trust policy: whatever registered the
      # revision this run starts from (deploy) or returns to (rollback), it
      # must have the shape Terraform gives its family, or nothing is
      # registered or moved. Web: app, plus tls-proxy while the hop is
      # encrypted, plus worker exactly when the worker has no service of its
      # own; voice: app, plus tls-proxy while the hop is encrypted; worker,
      # destroy-due, patient-export, erase-person, amend-contact,
      # reapply-erasures and migrate: app; db-bootstrap: db-admin. The
      # execution role everywhere, the app task role on web, worker, voice
      # and destroy-due, the export task role on patient-export, none on the
      # operator scripts, the db-admin task role on db-bootstrap and none on
      # migrate (the db-admin role may write the internal secrets; no app
      # container may hold it). No container but migrate's and db-bootstrap's
      # may carry what Terraform refuses the app tasks (never_on_app_tasks in
      # infra/aws/locals.tf), and only db-bootstrap may name a Secrets Manager
      # secret: the RDS master user's. On a deploy, every one must also
      # declare the CPU architecture the images were just built for.
      - name: Check the task definitions
        if: ${{ steps.run.outputs.mode == 'deploy' || steps.run.outputs.mode == 'rollback' }}
        env:
          NEVER_ON_APP_TASKS: MIGRATION_DATABASE_URL HEALDESK_LOCAL_KEK HEALDESK_DIRECT_BOOKING_ENABLED HEALDESK_PHASE_TWO_ATTRIBUTION BETTER_AUTH_SECRETS
          MODE: ${{ steps.run.outputs.mode }}
          WORKER_SHARED: ${{ steps.services.outputs.worker_shared }}
          ARCHITECTURE: ${{ steps.services.outputs.architecture }}
        run: |
          role="arn:aws:iam::$AWS_ACCOUNT_ID:role/$CLUSTER"
          failed=0
          refuse() {
            echo "::error::$1 task definition ($(jq -r '"\(.family):\(.revision)"' "$2")): $3"
            failed=1
          }
          check() {
            local label=$1 file="$RUNNER_TEMP/$1.json" names task_role found
            names=$(jq -c '[.containerDefinitions[].name] | sort' "$file")
            case "$label" in
              web)
                if [ "$WORKER_SHARED" = true ]; then
                  [ "$names" = '["app","worker"]' ] || [ "$names" = '["app","tls-proxy","worker"]' ] \
                    || refuse "$label" "$file" "containers $names (no worker service exists, so the web task must carry the worker)"
                else
                  [ "$names" = '["app"]' ] || [ "$names" = '["app","tls-proxy"]' ] || refuse "$label" "$file" "containers $names"
                fi
                ;;
              voice) [ "$names" = '["app"]' ] || [ "$names" = '["app","tls-proxy"]' ] || refuse "$label" "$file" "containers $names" ;;
              worker | destroy-due | patient-export | erase-person | amend-contact | reapply-erasures | migrate) [ "$names" = '["app"]' ] || refuse "$label" "$file" "containers $names" ;;
              db-bootstrap) [ "$names" = '["db-admin"]' ] || refuse "$label" "$file" "containers $names" ;;
            esac
            [ "$(jq -r '.executionRoleArn // ""' "$file")" = "$role-ecs-execution" ] \
              || refuse "$label" "$file" "execution role $(jq -r '.executionRoleArn // "none"' "$file")"
            case "$label" in
              web | worker | voice | destroy-due) task_role="$role-app-task" ;;
              patient-export) task_role="$role-export-task" ;;
              db-bootstrap) task_role="$role-db-admin-task" ;;
              migrate | erase-person | amend-contact | reapply-erasures) task_role="" ;;
            esac
            [ "$(jq -r '.taskRoleArn // ""' "$file")" = "$task_role" ] \
              || refuse "$label" "$file" "task role $(jq -r '.taskRoleArn // "none"' "$file")"
            if [ "$label" != migrate ] && [ "$label" != db-bootstrap ]; then
              found=$(jq -r --arg never "$NEVER_ON_APP_TASKS" '($never | split(" ")) as $n
                | [.containerDefinitions[] | (.environment // []) + (.secrets // []) | .[].name
                  | select(. as $name | $n | index($name))] | unique | join(" ")' "$file")
              [ -z "$found" ] || refuse "$label" "$file" "carries $found, which no app task may"
            fi
            if [ "$label" != db-bootstrap ]; then
              found=$(jq -r '[.containerDefinitions[] | (.secrets // [])[]
                | select(.valueFrom | contains(":secretsmanager:")) | .name] | join(" ")' "$file")
              [ -z "$found" ] || refuse "$label" "$file" "reads $found from Secrets Manager, which only db-bootstrap may"
            fi
            if [ "$MODE" = deploy ]; then
              found=$(jq -r '.runtimePlatform.cpuArchitecture // "X86_64"' "$file")
              [ "$found" = "$ARCHITECTURE" ] || refuse "$label" "$file" "declares $found, but the images were built for $ARCHITECTURE"
            fi
          }
          for label in web worker voice destroy-due patient-export erase-person amend-contact reapply-erasures migrate db-bootstrap; do
            if [ -f "$RUNNER_TEMP/$label.json" ]; then check "$label"; fi
          done
          if [ "$failed" = 1 ]; then
            echo "::error::Nothing was registered or moved. A revision shaped differently from Terraform's came from outside this workflow: find out how before deploying again (CloudTrail names who registered it)."
          fi
          exit "$failed"

      # ---------------------------------------------- restart or roll back
      # Each service's deployment is followed by its own id: the circuit
      # breaker rolls a failed deployment back to the previous one, and the
      # service is then "stable" again, so stability alone would report a
      # failure as a success. The deployments run side by side and share one
      # 30-minute deadline, which keeps the whole step inside this session.
      #
      # Voice is waited for differently. Its old tasks drain their calls for
      # up to an hour before ECS stops them (infra/aws/alb.tf), and its
      # deployment completes only once they have stopped, so waiting for that
      # would hold this job for an hour after every rollout. Its wait ends as
      # soon as the new deployment runs all its tasks and every older one has
      # been told to stop (desired 0) while still holding tasks: with a
      # minimum healthy of 100%, ECS starts draining the old tasks only once
      # the new ones pass the load balancer's checks. The old ones then finish
      # their calls and stop on their own; a failure after that is the circuit
      # breaker's to roll back and voice-below-desired's to report.
      - name: Restart or roll back the services
        if: ${{ steps.run.outputs.mode == 'restart' || steps.run.outputs.mode == 'rollback' }}
        env:
          WEB_DESIRED: ${{ steps.services.outputs.web_desired }}
          WORKER_DESIRED: ${{ steps.services.outputs.worker_desired }}
          WORKER_SHARED: ${{ steps.services.outputs.worker_shared }}
          VOICE_ON: ${{ steps.services.outputs.voice_on }}
          VOICE_DESIRED: ${{ steps.services.outputs.voice_desired }}
          WEB_TARGET: ${{ steps.rollback.outputs.web_task_definition }}
          WORKER_TARGET: ${{ steps.rollback.outputs.worker_task_definition }}
          VOICE_TARGET: ${{ steps.rollback.outputs.voice_task_definition }}
        run: |
          # A restart starts fresh tasks of the running revision; a rollback
          # names the revision to return to.
          move() {
            local args=(--force-new-deployment)
            [ -z "$2" ] || args+=(--task-definition "$2")
            aws ecs update-service --cluster "$CLUSTER" --service "$1" "${args[@]}" \
              --query "service.deployments[?status=='PRIMARY'] | [0].id" --output text
          }
          # What a deployment's rollout says: COMPLETED, FAILED <reason>, GONE
          # (the circuit breaker replaced it), SERVING (voice only, above) or
          # IN_PROGRESS.
          rollout() {
            jq -r --arg id "$1" --arg serving "$2" '(.services[0].deployments // []) as $all
              | ($all | map(select(.id == $id)) | first) as $d
              | if $d == null then "GONE"
                elif $d.rolloutState == "COMPLETED" then "COMPLETED"
                elif $d.rolloutState == "FAILED" then "FAILED \($d.rolloutStateReason // "")"
                elif $serving == "true" and $d.desiredCount > 0 and $d.runningCount >= $d.desiredCount
                  and ([$all[] | select(.id != $id) | .desiredCount] | all(. == 0))
                  and ([$all[] | select(.id != $id) | .runningCount] | add // 0) > 0 then "SERVING"
                else "IN_PROGRESS" end'
          }
          deadline=$(($(date +%s) + 1800))
          wait_for() {
            local service=$1 id=$2 serving=$3 state
            while :; do
              # A read that fails leaves state empty and is tried again.
              state=$(aws ecs describe-services --cluster "$CLUSTER" --services "$service" --output json \
                | rollout "$id" "$serving") || state=""
              case "$state" in
                COMPLETED) echo "$service: deployment $id completed"; return 0 ;;
                SERVING) echo "$service: deployment $id runs all its tasks, healthy; the old tasks finish their calls (up to an hour) and stop on their own"; return 0 ;;
                FAILED*) echo "::error::$service: deployment $id failed: ${state#FAILED }"; return 1 ;;
                GONE) echo "::error::$service: deployment $id is gone: the circuit breaker rolled it back"; return 1 ;;
              esac
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::$service: deployment $id did not finish within 30 minutes"
                return 1
              fi
              sleep 15
            done
          }
          services=()
          targets=()
          # A worker at 0 tasks has nothing to restart; a rollback still moves
          # it, so whatever starts it next runs the same commit as web. A
          # shared worker is restarted or rolled back with web.
          if [ "$WORKER_SHARED" = true ]; then
            echo "The worker runs inside the web tasks and moves with them."
          elif [ "$WORKER_DESIRED" = 0 ] && [ -z "$WORKER_TARGET" ]; then
            echo "::warning::$WORKER_SERVICE runs no tasks, so it was not restarted."
          else
            services+=("$WORKER_SERVICE")
            targets+=("$WORKER_TARGET")
          fi
          services+=("$WEB_SERVICE")
          targets+=("$WEB_TARGET")
          # Voice the same way as a worker of its own: at 0 tasks it has
          # nothing to restart, but a rollback still moves it.
          if [ "$VOICE_ON" != true ]; then
            echo "Voice is off: there is no $VOICE_SERVICE."
          elif [ "$VOICE_DESIRED" = 0 ] && [ -z "$VOICE_TARGET" ]; then
            echo "::warning::$VOICE_SERVICE runs no tasks, so it was not restarted."
          else
            services+=("$VOICE_SERVICE")
            targets+=("$VOICE_TARGET")
          fi
          ids=()
          for i in "${!services[@]}"; do
            id=$(move "${services[$i]}" "${targets[$i]}")
            echo "${services[$i]}: deployment $id started${targets[$i]:+ (${targets[$i]})}"
            ids+=("$id")
          done
          failed=0
          for i in "${!services[@]}"; do
            serving=false
            [ "${services[$i]}" != "$VOICE_SERVICE" ] || serving=true
            wait_for "${services[$i]}" "${ids[$i]}" "$serving" || failed=1
          done
          exit "$failed"

      # ---------------------------------------------------------------- render
      - name: Render web (app)
        id: render-web-app
        if: ${{ steps.run.outputs.mode == 'deploy' }}
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: ${{ runner.temp }}/web.json
          container-name: app
          image: ${{ steps.images.outputs.app_image }}

      - name: Render web (tls-proxy)
        id: render-web
        if: ${{ steps.run.outputs.mode == 'deploy' && steps.taskdefs.outputs.web_has_tls_proxy == 'true' }}
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: ${{ steps.render-web-app.outputs.task-definition }}
          container-name: tls-proxy
          image: ${{ steps.images.outputs.tls_proxy_image }}

      - name: Render web (worker)
        id: render-web-worker
        if: ${{ steps.run.outputs.mode == 'deploy' && steps.taskdefs.outputs.web_has_worker == 'true' }}
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: ${{ steps.render-web.outputs.task-definition || steps.render-web-app.outputs.task-definition }}
          container-name: worker
          image: ${{ steps.images.outputs.app_image }}

      - name: Render worker
        id: render-worker
        if: ${{ steps.run.outputs.mode == 'deploy' && steps.services.outputs.worker_shared != 'true' }}
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: ${{ runner.temp }}/worker.json
          container-name: app
          image: ${{ steps.images.outputs.app_image }}

      # The voice task as the web task: its process is the "app" container,
      # with the sidecar beside it while the hop is encrypted.
      - name: Render voice (app)
        id: render-voice-app
        if: ${{ steps.run.outputs.mode == 'deploy' && steps.services.outputs.voice_on == 'true' }}
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: ${{ runner.temp }}/voice.json
          container-name: app
          image: ${{ steps.images.outputs.app_image }}

      - name: Render voice (tls-proxy)
        id: render-voice
        if: ${{ steps.run.outputs.mode == 'deploy' && steps.services.outputs.voice_on == 'true' && steps.taskdefs.outputs.voice_has_tls_proxy == 'true' }}
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: ${{ steps.render-voice-app.outputs.task-definition }}
          container-name: tls-proxy
          image: ${{ steps.images.outputs.tls_proxy_image }}

      - name: Render destroy-due
        id: render-destroy-due
        if: ${{ steps.run.outputs.mode == 'deploy' }}
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: ${{ runner.temp }}/destroy-due.json
          container-name: app
          image: ${{ steps.images.outputs.app_image }}

      - name: Render patient-export
        id: render-patient-export
        if: ${{ steps.run.outputs.mode == 'deploy' }}
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: ${{ runner.temp }}/patient-export.json
          container-name: app
          image: ${{ steps.images.outputs.app_image }}

      - name: Render erase-person
        id: render-erase-person
        if: ${{ steps.run.outputs.mode == 'deploy' }}
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: ${{ runner.temp }}/erase-person.json
          container-name: app
          image: ${{ steps.images.outputs.app_image }}

      - name: Render amend-contact
        id: render-amend-contact
        if: ${{ steps.run.outputs.mode == 'deploy' }}
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: ${{ runner.temp }}/amend-contact.json
          container-name: app
          image: ${{ steps.images.outputs.app_image }}

      - name: Render reapply-erasures
        id: render-reapply-erasures
        if: ${{ steps.run.outputs.mode == 'deploy' }}
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: ${{ runner.temp }}/reapply-erasures.json
          container-name: app
          image: ${{ steps.images.outputs.app_image }}

      - name: Render migrate
        id: render-migrate
        if: ${{ steps.run.outputs.mode == 'deploy' && inputs.migrate }}
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: ${{ runner.temp }}/migrate.json
          container-name: app
          image: ${{ steps.images.outputs.app_image }}

      - name: Render db-bootstrap
        id: render-db-bootstrap
        if: ${{ steps.run.outputs.mode == 'deploy' && inputs.bootstrap_db }}
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: ${{ runner.temp }}/db-bootstrap.json
          container-name: db-admin
          image: ${{ steps.images.outputs.db_admin_image }}

      # Registered only: these two run below, as one-off tasks, never as
      # services.
      - name: Register db-bootstrap
        id: register-db-bootstrap
        if: ${{ steps.run.outputs.mode == 'deploy' && inputs.bootstrap_db }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.render-db-bootstrap.outputs.task-definition }}
          cluster: ${{ env.CLUSTER }}

      - name: Register migrate
        id: register-migrate
        if: ${{ steps.run.outputs.mode == 'deploy' && inputs.migrate }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.render-migrate.outputs.task-definition }}
          cluster: ${{ env.CLUSTER }}

      # ------------------------------------------------------- one-off tasks
      # Run with the AWS CLI rather than the deploy action's run-task, whose
      # failure message is only the containers' reason field (null for an
      # ordinary non-zero exit). Each task gets the web service's private
      # subnets and security group, the one the database admits. Nothing is
      # overridden at run time: run-task arguments land in CloudTrail, so the
      # commands and secrets live in the task definitions. db-bootstrap goes
      # first: migrate reads the migrator URL it may just have written, and
      # ECS reads a task's secrets when the task starts.
      - name: Run the one-off tasks
        if: ${{ steps.run.outputs.mode == 'deploy' && (inputs.bootstrap_db || inputs.migrate) }}
        env:
          DB_BOOTSTRAP_TASK: ${{ steps.register-db-bootstrap.outputs.task-definition-arn }}
          MIGRATE_TASK: ${{ steps.register-migrate.outputs.task-definition-arn }}
          SUBNETS: ${{ steps.services.outputs.subnets }}
          SECURITY_GROUPS: ${{ steps.services.outputs.security_groups }}
        run: |
          run_one_off() {
            local label=$1 task_definition=$2 container=$3 taskdef_file=$4
            local network started task deadline status stopped exit_code group prefix
            network=$(jq -nc --arg s "$SUBNETS" --arg g "$SECURITY_GROUPS" \
              '{awsvpcConfiguration: {subnets: ($s | split(",")), securityGroups: ($g | split(",")), assignPublicIp: "DISABLED"}}')
            started=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$task_definition" \
              --launch-type FARGATE --network-configuration "$network" \
              --started-by "deploy-$GITHUB_RUN_ID" --output json)
            task=$(jq -r '.tasks[0].taskArn // empty' <<<"$started")
            if [ -z "$task" ]; then
              echo "::error::$label did not start: $(jq -r '[.failures[]? | "\(.reason) \(.detail // "")"] | join("; ")' <<<"$started")"
              return 1
            fi
            echo "$label: task ${task##*/} started (${task_definition##*/})"
            deadline=$(($(date +%s) + 1200))
            while :; do
              status=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task" \
                --query 'tasks[0].lastStatus' --output text) || status="unreadable"
              [ "$status" = STOPPED ] && break
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::$label was still $status after 20 minutes. It is still running: stop it from the ECS console if it does not finish."
                return 1
              fi
              sleep 10
            done
            stopped=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task" --output json)
            exit_code=$(jq -r --arg c "$container" '.tasks[0].containers[] | select(.name == $c) | .exitCode // "none"' <<<"$stopped")
            echo "$label: stopped ($(jq -r '.tasks[0].stopCode // "unknown"' <<<"$stopped")): $(jq -r '.tasks[0].stoppedReason // "no reason given"' <<<"$stopped")"
            echo "$label: container $container exit code $exit_code$(jq -r --arg c "$container" '.tasks[0].containers[] | select(.name == $c) | .reason // empty | ", \(.)"' <<<"$stopped")"
            if [ "$exit_code" != 0 ]; then
              group=$(jq -r --arg c "$container" '.containerDefinitions[] | select(.name == $c) | .logConfiguration.options["awslogs-group"] // "?"' "$taskdef_file")
              prefix=$(jq -r --arg c "$container" '.containerDefinitions[] | select(.name == $c) | .logConfiguration.options["awslogs-stream-prefix"] // "?"' "$taskdef_file")
              echo "::error::$label failed (exit code $exit_code). Its output is in CloudWatch Logs, group $group, stream $prefix/$container/${task##*/}; it is not printed here because it can carry data."
              return 1
            fi
          }
          if [ -n "$DB_BOOTSTRAP_TASK" ]; then
            run_one_off db-bootstrap "$DB_BOOTSTRAP_TASK" db-admin "$RUNNER_TEMP/db-bootstrap.json"
          fi
          if [ -n "$MIGRATE_TASK" ]; then
            run_one_off migrate "$MIGRATE_TASK" app "$RUNNER_TEMP/migrate.json"
          fi

      # --------------------------------------------------------------- services
      # Each session is the action's default hour, and the one-off tasks can
      # use forty minutes of one; the rollout, and the clean-up after a failed
      # one, get their own.
      - name: Renew the deploy role session for the rollout
        if: ${{ steps.run.outputs.mode == 'deploy' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.run.outputs.deploy_role }}
          role-session-name: healdesk-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          unset-current-credentials: true

      # The worker first: old and new workers overlapping is safe (notices are
      # leased), and it should be on the new schema before the web tier is.
      # The action waits for stability and fails if the circuit breaker rolled
      # the deployment back. An empty desired-count keeps the current one. A
      # shared worker deploys with the web tier, in the same tasks.
      - name: Deploy the worker
        id: deploy-worker
        if: ${{ steps.run.outputs.mode == 'deploy' && steps.services.outputs.worker_shared != 'true' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.render-worker.outputs.task-definition }}
          cluster: ${{ env.CLUSTER }}
          service: ${{ env.WORKER_SERVICE }}
          desired-count: ${{ steps.services.outputs.worker_count }}
          wait-for-service-stability: true
          wait-for-minutes: 15
          wait-max-delay-seconds: 15

      - name: Deploy the web tier
        id: deploy-web
        if: ${{ steps.run.outputs.mode == 'deploy' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.render-web-worker.outputs.task-definition || steps.render-web.outputs.task-definition || steps.render-web-app.outputs.task-definition }}
          cluster: ${{ env.CLUSTER }}
          service: ${{ env.WEB_SERVICE }}
          desired-count: ${{ steps.services.outputs.web_count }}
          wait-for-service-stability: true
          wait-for-minutes: 15
          wait-max-delay-seconds: 15

      # Voice last, once the web tier it shares the schema and the tool layer
      # with is on the new code. Registered by the action, but rolled here
      # rather than by it: the action can only wait for the service to be
      # stable, which for voice means waiting for the old tasks to finish
      # their calls, up to an hour (infra/aws/alb.tf). This waits instead, up
      # to 15 minutes, for the new tasks to serve, exactly as "Restart or roll
      # back the services" does, and follows the deployment by its id so a
      # circuit-breaker rollback is a failure. An empty count keeps the
      # current one; at 0 (voice just switched on) it is the DesiredCount tag.
      - name: Register voice
        id: register-voice
        if: ${{ steps.run.outputs.mode == 'deploy' && steps.services.outputs.voice_on == 'true' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.render-voice.outputs.task-definition || steps.render-voice-app.outputs.task-definition }}
          cluster: ${{ env.CLUSTER }}

      - name: Deploy the voice endpoint
        id: deploy-voice
        if: ${{ steps.run.outputs.mode == 'deploy' && steps.services.outputs.voice_on == 'true' }}
        env:
          TASK_DEFINITION: ${{ steps.register-voice.outputs.task-definition-arn }}
          VOICE_COUNT: ${{ steps.services.outputs.voice_count }}
        run: |
          if [ -z "$TASK_DEFINITION" ]; then
            echo "::error::The voice revision was not registered."
            exit 1
          fi
          args=(--task-definition "$TASK_DEFINITION")
          [ -z "$VOICE_COUNT" ] || args+=(--desired-count "$VOICE_COUNT")
          id=$(aws ecs update-service --cluster "$CLUSTER" --service "$VOICE_SERVICE" "${args[@]}" \
            --query "service.deployments[?status=='PRIMARY'] | [0].id" --output text)
          echo "$VOICE_SERVICE: deployment $id started (${TASK_DEFINITION##*/}${VOICE_COUNT:+, $VOICE_COUNT task(s)})"
          # The same reading of the rollout as the restart step's (SERVING:
          # the new tasks pass their checks and the old ones are draining).
          rollout() {
            jq -r --arg id "$1" '(.services[0].deployments // []) as $all
              | ($all | map(select(.id == $id)) | first) as $d
              | if $d == null then "GONE"
                elif $d.rolloutState == "COMPLETED" then "COMPLETED"
                elif $d.rolloutState == "FAILED" then "FAILED \($d.rolloutStateReason // "")"
                elif $d.desiredCount > 0 and $d.runningCount >= $d.desiredCount
                  and ([$all[] | select(.id != $id) | .desiredCount] | all(. == 0))
                  and ([$all[] | select(.id != $id) | .runningCount] | add // 0) > 0 then "SERVING"
                else "IN_PROGRESS" end'
          }
          deadline=$(($(date +%s) + 900))
          while :; do
            # A read that fails leaves state empty and is tried again.
            state=$(aws ecs describe-services --cluster "$CLUSTER" --services "$VOICE_SERVICE" --output json \
              | rollout "$id") || state=""
            case "$state" in
              COMPLETED) echo "$VOICE_SERVICE: deployment $id completed"; exit 0 ;;
              SERVING) echo "$VOICE_SERVICE: deployment $id runs all its tasks, healthy; the old tasks finish their calls (up to an hour) and stop on their own"; exit 0 ;;
              FAILED*) echo "::error::$VOICE_SERVICE: deployment $id failed: ${state#FAILED }"; exit 1 ;;
              GONE) echo "::error::$VOICE_SERVICE: deployment $id is gone: the circuit breaker rolled it back"; exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::$VOICE_SERVICE: deployment $id was not serving within 15 minutes. Read the service's events; the circuit breaker may still roll it back."
              exit 1
            fi
            sleep 15
          done

      # Registered only, once the services run this commit's image: the
      # after-restore check (docs/handover.md, "Restoring") is run by hand,
      # with infra/aws/scripts/run-task.sh destroy-due, which picks the
      # revision naming the image the worker runs (in the web task when the
      # worker shares it). This role may register it but not run it.
      - name: Register destroy-due
        id: register-destroy-due
        if: ${{ steps.run.outputs.mode == 'deploy' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.render-destroy-due.outputs.task-definition }}
          cluster: ${{ env.CLUSTER }}

      # The same for the offboarding export (docs/handover.md, "Retention and
      # offboarding", step 2): run by hand with run-task.sh patient-export.
      - name: Register patient-export
        id: register-patient-export
        if: ${{ steps.run.outputs.mode == 'deploy' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.render-patient-export.outputs.task-definition }}
          cluster: ${{ env.CLUSTER }}

      # And the two patient-rights operator scripts (docs/handover.md,
      # "Deletion requests", "Amendments"), run by hand with run-task.sh.
      - name: Register erase-person
        id: register-erase-person
        if: ${{ steps.run.outputs.mode == 'deploy' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.render-erase-person.outputs.task-definition }}
          cluster: ${{ env.CLUSTER }}

      - name: Register amend-contact
        id: register-amend-contact
        if: ${{ steps.run.outputs.mode == 'deploy' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.render-amend-contact.outputs.task-definition }}
          cluster: ${{ env.CLUSTER }}

      - name: Register reapply-erasures
        id: register-reapply-erasures
        if: ${{ steps.run.outputs.mode == 'deploy' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.render-reapply-erasures.outputs.task-definition }}
          cluster: ${{ env.CLUSTER }}

      # A service this run started from 0 has no good revision to fall back
      # to: its last completed deployment is Terraform's, at 0 tasks, with a
      # placeholder image that was never pushed. The circuit breaker would
      # return it there at the count this run set, and ECS would retry that
      # pull until the next good deploy. So a failed or cancelled rollout of
      # such a service puts it back at 0 tasks, and the next run starts it
      # afresh. A service that was already running is left to the breaker,
      # whose rollback target then exists. A smoke-test failure alone never
      # gets here: the tasks it tested are healthy.
      - name: Put a failed first rollout back to 0 tasks
        if: >-
          ${{ (failure() || cancelled()) && steps.run.outputs.mode == 'deploy'
          && ((steps.deploy-worker.outcome == 'failure' || steps.deploy-worker.outcome == 'cancelled')
          || (steps.deploy-web.outcome == 'failure' || steps.deploy-web.outcome == 'cancelled')
          || (steps.deploy-voice.outcome == 'failure' || steps.deploy-voice.outcome == 'cancelled')) }}
        env:
          WORKER_OUTCOME: ${{ steps.deploy-worker.outcome }}
          WEB_OUTCOME: ${{ steps.deploy-web.outcome }}
          VOICE_OUTCOME: ${{ steps.deploy-voice.outcome }}
          WORKER_DESIRED: ${{ steps.services.outputs.worker_desired }}
          WEB_DESIRED: ${{ steps.services.outputs.web_desired }}
          VOICE_DESIRED: ${{ steps.services.outputs.voice_desired }}
        run: |
          back_to_zero() {
            local service=$1 outcome=$2 desired_before=$3
            case "$outcome" in failure | cancelled) ;; *) return 0 ;; esac
            if [ "$desired_before" != 0 ]; then
              echo "$service was running before this deploy: the circuit breaker returns it to that revision."
              return 0
            fi
            aws ecs update-service --cluster "$CLUSTER" --service "$service" --desired-count 0 \
              --query 'service.desiredCount' --output text >/dev/null
            echo "::warning::$service: its first rollout did not finish, so it is back at 0 tasks rather than retrying Terraform's placeholder image. Fix the cause and deploy again; that run starts it afresh."
          }
          back_to_zero "$WORKER_SERVICE" "$WORKER_OUTCOME" "$WORKER_DESIRED"
          back_to_zero "$WEB_SERVICE" "$WEB_OUTCOME" "$WEB_DESIRED"
          back_to_zero "$VOICE_SERVICE" "$VOICE_OUTCOME" "$VOICE_DESIRED"

      # From outside, through Cloudflare's DNS, the load balancer and (when on)
      # the TLS sidecar: the path a clinic's browser takes. The liveness probe
      # touches nothing and carries nothing.
      - name: Smoke test
        run: |
          url="$APP_URL/api/health?probe=liveness"
          for attempt in $(seq 1 20); do
            code=$(curl --silent --max-time 10 --output "$RUNNER_TEMP/liveness.json" \
              --write-out '%{http_code}' "$url" || true)
            if [ "$code" = 200 ] && jq -e '.ok == true' "$RUNNER_TEMP/liveness.json" >/dev/null 2>&1; then
              echo "$url answered 200"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            sleep 15
          done
          echo "::error::$url did not answer 200 within five minutes."
          exit 1

      # The full commit is what rollback_to takes later.
      - name: Summary
        env:
          MODE: ${{ steps.run.outputs.mode }}
          WEB_TASK: ${{ steps.deploy-web.outputs.task-definition-arn || steps.rollback.outputs.web_task_definition }}
          WORKER_TASK: ${{ steps.deploy-worker.outputs.task-definition-arn || steps.rollback.outputs.worker_task_definition }}
          VOICE_TASK: ${{ steps.register-voice.outputs.task-definition-arn || steps.rollback.outputs.voice_task_definition }}
          WORKER_SHARED: ${{ steps.services.outputs.worker_shared }}
          VOICE_ON: ${{ steps.services.outputs.voice_on }}
          ARCHITECTURE: ${{ steps.services.outputs.architecture }}
          DESTROY_DUE_TASK: ${{ steps.register-destroy-due.outputs.task-definition-arn }}
          PATIENT_EXPORT_TASK: ${{ steps.register-patient-export.outputs.task-definition-arn }}
          ERASE_PERSON_TASK: ${{ steps.register-erase-person.outputs.task-definition-arn }}
          AMEND_CONTACT_TASK: ${{ steps.register-amend-contact.outputs.task-definition-arn }}
          REAPPLY_ERASURES_TASK: ${{ steps.register-reapply-erasures.outputs.task-definition-arn }}
          ROLLED_BACK_TO: ${{ steps.rollback.outputs.commit }}
          MIGRATED: ${{ inputs.migrate }}
          BOOTSTRAPPED: ${{ inputs.bootstrap_db }}
        run: |
          voice_line() {
            if [ "$VOICE_ON" != true ]; then
              echo "- voice: off (enable_voice)"
            else
              echo "- voice: ${VOICE_TASK##*/} (old tasks, if any, finish their calls before they stop: up to an hour)"
            fi
          }
          {
            case "$MODE" in
              deploy)
                echo "### Deployed $GITHUB_SHA"
                echo
                echo "- web: ${WEB_TASK##*/} ($ARCHITECTURE)"
                if [ "$WORKER_SHARED" = true ]; then echo "- worker: inside web"; else echo "- worker: ${WORKER_TASK##*/}"; fi
                voice_line
                echo "- destroy-due: ${DESTROY_DUE_TASK##*/} (registered; run by hand after a restore)"
                echo "- patient-export: ${PATIENT_EXPORT_TASK##*/} (registered; run by hand at offboarding)"
                echo "- erase-person: ${ERASE_PERSON_TASK##*/}, amend-contact: ${AMEND_CONTACT_TASK##*/}, reapply-erasures: ${REAPPLY_ERASURES_TASK##*/} (registered; run by hand)"
                echo "- db-bootstrap: $([ "$BOOTSTRAPPED" = true ] && echo ran || echo skipped)"
                echo "- migrations: $([ "$MIGRATED" = true ] && echo ran || echo skipped)"
                ;;
              rollback)
                echo "### Rolled back to $ROLLED_BACK_TO"
                echo
                echo "- web: ${WEB_TASK##*/}"
                if [ "$WORKER_SHARED" = true ]; then echo "- worker: inside web"; else echo "- worker: ${WORKER_TASK##*/}"; fi
                voice_line
                echo "- migrations: not run (the schema stays where it is)"
                echo
                echo "Make main match before the next deploy (git revert), or it brings the bad commit back."
                ;;
              restart)
                echo "### Restarted the services"
                echo
                echo "Same revisions, fresh tasks: each has read its parameters again."
                if [ "$VOICE_ON" = true ]; then
                  echo "Voice's old tasks finish their calls, up to an hour, before they stop."
                fi
                ;;
            esac
          } >>"$GITHUB_STEP_SUMMARY"
