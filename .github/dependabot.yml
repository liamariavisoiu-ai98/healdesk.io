# Dependabot version updates. Until this file existed nothing in the repository
# noticed a new release of anything: every pin, from an action's commit SHA to
# the Terraform providers' lock file, stayed where it was the day it was
# written, and an advisory against one of them reached us only if somebody
# happened to read it.
#
# One schedule for everything (Monday, off-peak, UTC), and a pull request only
# for a minor or patch release, grouped, because the free reviewer is one
# person: a week's patches are read together. A major release (TypeScript 7,
# ESLint 10, Stripe 23, a new Postgres or Node base image) is a decision with a
# migration behind it, so it is taken by hand, on purpose, and not offered as a
# pull request every week. The first version of this file let majors through
# and opened 23 pull requests in its first run, most of them majors; the
# open-pull-request limit counts per directory, and npm below names six.
#
# `allow` with `update-types` limits VERSION updates only. GitHub's own
# reference says security updates "will always be created regardless of the
# update-types setting", so a fix that needs a major version still arrives as a
# security update once Dependabot security updates are on. `ignore` is not used
# for this because it applies to security updates as well.
#
# Dependabot only opens pull requests; it never merges one. Turning on
# Dependabot alerts and security updates is a repository setting that only the
# Owner can switch (docs/design/security-hygiene-brief-2026-10-21.md).
version: 2

updates:
  # The npm workspaces share the root package-lock.json. Dependabot reads the
  # lock from the root, and each workspace's package.json is named here so a
  # range in one of them is updated too. The group makes it one pull request
  # per directory at most, so the limit is a ceiling that is not reached.
  - package-ecosystem: npm
    directories:
      - "/"
      - "/apps/app"
      - "/apps/web"
      - "/packages/catalog"
      - "/packages/connectors"
      - "/packages/leadgen"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  # Actions are pinned by full commit SHA with a version comment. Dependabot
  # moves the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, ci]

  # infra/aws: the providers pinned in .terraform.lock.hcl. The Terraform CLI
  # version is pinned in the workflows (setup-terraform) and is not Dependabot's.
  # A provider major (aws 6 to 7) is a plan to read, not a weekly pull request.
  - package-ecosystem: terraform
    directory: "/infra/aws"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      terraform-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, infra]

  # The base images of the product image and of the two sidecar images the AWS
  # host builds (db-admin, tls-proxy). A new Postgres or Node major is a
  # migration of its own and is done by hand.
  - package-ecosystem: docker
    directories:
      - "/apps/app"
      - "/infra/aws/images/*"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, infra]
